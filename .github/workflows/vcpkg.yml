on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
name: Vcpkg
permissions:
  contents: read
jobs:
  vcpkg-port:
    name: "Build Vcpkg Port"
    strategy:
      matrix:
        variant:
          - runner: windows-2025-vs2026
            triplet: x64-windows
          - runner: windows-11-arm
            triplet: arm64-windows
    runs-on: ${{ matrix.variant.runner }}
    steps:
      - name: "Checkout"  
        uses: actions/checkout@v6
        with: 
          submodules: recursive
      - name: "Build"
        uses: johnwason/vcpkg-action@v8
        id: vcpkg
        with:
          pkgs: libdesktop
          triplet: ${{ matrix.variant.triplet }}
          revision: a0b1c8d3a477c1cb4813d8e127a56961707ca42b
          token: ${{ github.token }}
          cache-key: ${{ matrix.variant.triplet }}
          vcpkg-subdir: vcpkg-tool
          extra-args: --overlay-ports="${{ github.workspace }}\vcpkg\ports"