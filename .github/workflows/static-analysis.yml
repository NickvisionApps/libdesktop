on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [ "review_requested", "ready_for_review" ]
  workflow_dispatch:
name: Static Analysis
permissions:
  contents: read
env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
jobs:
  static-analysis:
    name: "Static Analysis"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: "Setup Environment"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-format \
            clang-tidy \
            clang-tools \
            libsqlcipher-dev \
            gettext \
            tzdata \
            locales \
            xdg-user-dirs \
            libsecret-1-dev \
            libglib2.0-dev
          sudo locale-gen en_US.UTF-8
          sudo update-locale LANG=en_US.UTF-8

      - name: "Vcpkg"
        uses: johnwason/vcpkg-action@v7
        id: vcpkg
        with:
          pkgs: curl gettext-libintl maddy nlohmann-json
          triplet: x64-linux
          revision: 522253caf47268c1724f486a035e927a42a90092
          token: ${{ github.token }}
          cache-key: x64-linux-static-analysis

      - name: "clang-format"
        run: |
          find include src tests -name '*.cpp' -o -name '*.h' | \
            xargs clang-format --dry-run --Werror

      - name: "Configure (generate compile_commands.json)"
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTING=OFF

      - name: "clang-tidy"
        run: |
          FAILED=0
          while IFS= read -r file; do
            clang-tidy -p build "$file" || FAILED=1
          done < <(find src -name '*.cpp' \
            ! -path '*/process_windows.cpp' \
            ! -path '*/secret_service_windows.cpp' \
            ! -path '*/environment_windows.cpp' \
            ! -path '*/power_service_windows.cpp' \
            ! -path '*/user_directories_windows.cpp')
          exit $FAILED
